[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hi-hola-annyong"
version = "0.1.0"
description = "Local Spanish voice tutor backend"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "av==18.1.0",
    "fastapi>=0.165.0",
    "faster-whisper",
    "kokoro",
    "phonemizer",
    "pydantic>=2",
    "pymupdf",
    "pyspellchecker>=0.9.1",
    "python-multipart>=0.0.34",
    "scipy",
    "sounddevice",
    "soundfile",
    "torch",
    "transformers",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "jiwer",
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-socket",
    "pytest-timeout",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
include = [
    "audio*",
    "memory*",
    "pronunciation*",
    "model_diagnostics*",
    "tutor*",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
